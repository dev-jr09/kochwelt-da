<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koch Welt</title>
    <link rel="icon" type="image/png" href="./assets/img/favicon.ico">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/contact.css">
    <script src="./scripts/hamburger.js"></script>
</head>
<body>
    


    <header>
        <div class="container">
            <div class="logo">
                <img src="./assets/img/logo.png" alt="Koch Welt Logo" 
                 onclick="window.location.href='/'" 
                style="cursor: pointer;">
            </div>
            <button class="hamburger" aria-label="Navigation">
                <img src="./assets/img/icons/hamburger.png" alt="Menu">
            </button>
            <nav class="nav-menu">
                <ul>
                    <li><a href="/">Start</a></li>
                    <li><a href="/recipes/manuel-von-k/index.html">Rezept des Tages</a></li>
                    <li><a href="/contact.html">Kontakt</a></li>
                    <li><a href="/impressum.html">Impressum</a></li>
                </ul>
            </nav>
        </div>
    </header>


  <main>
        
    <div class="main-contact">


        <form class="contact" action="https://formspree.io/f/xojkgqal" method="POST">
          <h2>Kontaktiere uns</h2>

          <label>
            Dein Name:
            <input type="text" name="name" required>
          </label>

          <label>
            Deine E-Mail:
            <input type="email" name="email" required>
          </label>

          <label>
            Deine Nachricht:
            <textarea name="message" required></textarea>
          </label>

          <button class="button" type="submit">Abschicken</button>
      </form>
    </div>
  </main>


    <footer>
        <div class="container">
            <div class="logo-section">
                <img src="./assets/img/logo_small.png" alt="Koch Welt Logo" onclick="window.location.href='/'" style="cursor: pointer;">
                <p>© 2026 Koch Welt - CJM</p>
            </div>
            <div class="links-section">
                <h3>Navigation</h3>
                <a href="/">Start</a>
                <a href="/recipes/manuel-von-k/index.html">Rezept des Tages</a>
                <a href="/contact.html">Kontakt</a>
                <a href="/impressum.html">Impressum</a>
            </div>
        </div>
    </footer>
        
</body>
</html>
