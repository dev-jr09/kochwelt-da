<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koch Welt</title>
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="./scripts/hamburger.js"></script>
<body>
    


    <header>
        <div class="container">
            <div class="logo">
                <img src="./img/logo.png" alt="Koch Welt Logo" 
                 onclick="window.location.href='/'" 
                style="cursor: pointer;">
            </div>
            <button class="hamburger" aria-label="Navigation">
                <img src="./img/icons/hamburger.png" alt="Menu">
            </button>
            <nav class="nav-menu">
                <ul>
                    <li><a href="/">Start</a></li>
                    <li><a href="/recipe-bolognes.html">Rezept des Tages</a></li>
                    <li><a href="/contact.html">Kontakt</a></li>
                    <li><a href="/impressum.html">Impressum</a></li>
                </ul>
            </nav>
        </div>
    </header>


  <main>
        
    <div class="main-contact">

              <form class="contact" onsubmit="sendMail(event)">
      <h2>Kontaktiere uns</h2>

      <label>
        Dein Name:
        <input type="text" name="text">
      </label>
      <label>
        Deine EMail:
        <input type="email" name="email">
      </label>
      <label>
        Deine Nachricht:
        <textarea name="message"></textarea>
      </label>
      <button class="button" type="submit">Abschicken</button>
    </form>
    </div>

      </main>


    <footer>
        <div class="container">
        </div>
    </footer>
        
</body>
</html>
